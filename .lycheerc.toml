# Lychee link checker configuration
# See: https://lychee.cli.rs/#/usage/config

# Cache results between runs
cache = true

# Maximum number of concurrent network requests
max_concurrency = 8

# Request timeout in seconds
timeout = 30

# Retry failed requests
max_retries = 3
retry_wait_time = 5

# User agent string
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"

# Accept invalid SSL certificates (use cautiously)
insecure = false

# Exclude specific URLs or patterns
exclude = [
    # Local development URLs
    ".*localhost.*",
    ".*127\\.0\\.0\\.1.*",
    ".*0\\.0\\.0\\.0.*",

    # Example/placeholder URLs
    ".*example\\.com.*",
    ".*placeholder\\.com.*",
    ".*your-domain\\.com.*",

    # Social media that might block automated requests
    ".*linkedin\\.com.*",
    ".*twitter\\.com.*",
    ".*x\\.com.*",

    # Sometimes problematic academic sites
    ".*doi\\.org.*",
    ".*researchgate\\.net.*",

    # Email links
    "^mailto:.*",
]

# Exclude specific file paths
exclude_path = [
    "README.md",
    "_pages/404.md",
    "_posts/2015-10-20-math.md",
]

# Include only specific schemes
scheme = ["https", "http"]

# Accept these HTTP status codes as valid
accept = [200, 203, 206, 300, 301, 302, 303, 307, 308, 403, 429]
