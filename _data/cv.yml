# Experience
experience:
  - position: Research Intern
    company: Ant Research, RL Lab
    dates: 2024.12 – 2025.05
    description: "We built <strong><a href='https://github.com/inclusionAI/ASearcher'>ASearcher</a></strong>, a search agent trained with <strong><a href='https://github.com/inclusionAI/AReaL'>AReaL</a></strong>. Our agent exhibits extreme long-horizon search, with tool calls exceeding 40 turns and output tokens exceeding 150k during training time. With a simple agent design and no external LLMs, ASearcher achieves Avg@4 scores of 51.1 on xBench and 58.7 on GAIA, surpassing existing open-source 32B agents."

  - position: Research Intern
    company: Ant Research, RL Lab
    dates: 2024.12 – 2025.05
    description: "I lead the <strong><a href='https://github.com/inclusionAI/AReaL'>AReaL</a></strong> project, an asynchronous RL system for reasoning and agentic LLM training. It delivers the simplest solution for customizing agentic workflows, while reducing overall training time by 2.5× compared to the best open-source synchronous systems."

  - position: Research Intern
    company: Shanghai Qi Zhi Institute
    dates: 2023.5 – 2024.10
    description: "We designed <strong><a href='https://github.com/openpsi-project/ReaLHF'>ReaL</a></strong>, an efficient distributed system for LLM RLHF. It exhibits an average 26% improvement over heuristic approaches based on Megatron-LM, and at least 2× higher throughput than DeepSpeed-Chat."

  - position: Research Intern
    company: Shanghai Qi Zhi Institute
    dates: 2021.10 – 2023.5
    description: "We implemented <strong><a href='https://github.com/openpsi-project/srl'>SRL</a></strong>, a general-purpose game-centric RL system that can scale to over 10k CPU cores and 96 GPUs. We were the first to reproduce OpenAI's results in the Hide-And-Seek game."

  - position: Research Intern
    company: ByteDance
    dates: 2020.6 – 2020.9
    description: "We implemented a Ray-based system (not RLlib) to train an agent to play Unity-based FPS games. While the baseline required several days for training, our system could finish training within approximately 8 hours."

